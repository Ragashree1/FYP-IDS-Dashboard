# /etc/logstash/conf.d/suricata.conf
input {
  # Direct file input for Suricata's eve.json log
  file {
    path => "/var/log/suricata/eve.json"
    codec => "json"
    tags => ["suricata"]
    type => "suricata"
    start_position => "beginning"  # Start reading from beginning of file
    sincedb_path => "/var/lib/logstash/sincedb_suricata"  # Track file position
  }
  # Keep the beats input if you're also sending logs via Filebeat
  beats {
    port => 5044
    tags => ["beats", "suricata"]
    type => "suricata-beats"
  }
}
filter {
  if [type] == "suricata" or "suricata" in [tags] or [fields][log_type] == "suricata" or [event_type] == "alert" {
    # If the message is already JSON, parse it
    if [message] {
      json {
        source => "message"
        target => "suricata_json"
      }
      # Move fields from the parsed JSON to the root level
      if [suricata_json] {
        ruby {
          code => "
            event.get('suricata_json').each {|k, v| 
              event.set(k, v) unless k == '@timestamp'
            }
            event.remove('suricata_json')
          "
        }
      }
    }
    # Extract alert fields if this is an alert event
    if [event_type] == "alert" {
      # Extract alert details
      mutate {
        add_field => {
          "src_ip" => "%{[src_ip]}"
          "dest_ip" => "%{[dest_ip]}"
          "src_port" => "%{[src_port]}"
          "dest_port" => "%{[dest_port]}"
          "protocol" => "%{[proto]}"
          "message" => "%{[alert][signature]}"
          "classification" => "%{[alert][category]}"
          "signature_id" => "%{[alert][signature_id]}"
          "alert_source" => "suricata"
          "processed_by" => "suricata_logstash"
        }
      }
      # Set priority based on alert severity
      if [alert][severity] {
        mutate {
          add_field => { "priority" => "%{[alert][severity]}" }
        }
      } else {
        # Default priority based on category
        if [classification] =~ /.*web-application-attack.*/ or [classification] =~ /.*attempted-admin.*/ {
          mutate { add_field => { "priority" => "1" } }
        } else if [classification] =~ /.*attempted-recon.*/ or [classification] =~ /.*policy-violation.*/ {
          mutate { add_field => { "priority" => "2" } }
        } else {
          mutate { add_field => { "priority" => "3" } }
        }
      }
      # Convert numeric fields
      mutate {
        convert => {
          "src_port" => "integer"
          "dest_port" => "integer"
          "priority" => "integer"
          "signature_id" => "integer"
        }
      }
      # Clean up fields - but don't remove type as it's needed for output filtering
      mutate {
        remove_field => ["message_raw", "path", "host", "tags"]
      }
    }
    # IMPORTANT: Comment out the drop statement to prevent dropping non-alert events
    # else {
    #   drop { }
    # }
    # Ensure timestamp is properly formatted
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}
output {
  # Direct output for any event_type=alert, regardless of processed_by field
  if [event_type] == "alert" {
    elasticsearch {
      hosts => ["http://54.91.203.196:9200"]
      index => "suricata-alerts-%{+YYYY.MM.dd}"
      document_id => "%{[alert][signature_id]}-%{src_ip}-%{dest_ip}-%{+YYYY.MM.dd.HH.mm}"
    }
    # Enable debugging output
    stdout { codec => rubydebug }
  }
  # Keep the original output for backward compatibility
  if [processed_by] == "suricata_logstash" {
    elasticsearch {
      hosts => ["http://54.91.203.196:9200"]
      index => "suricata-logs-%{+YYYY.MM.dd}"
      document_id => "%{signature_id}-%{src_ip}-%{dest_ip}-%{+YYYY.MM.dd.HH.mm}"
    }
    # Enable debugging output
    stdout { codec => rubydebug }
  }
}
