# /etc/logstash/conf.d/zeek.conf
input {
  # Direct file input for Zeek logs
  file {
    path => "/opt/zeek/logs/current/*.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb_zeek"
    sincedb_clean_after => 0
    tags => ["zeek"]
    type => "zeek"
  }
  # JSON logs
  file {
    path => "/opt/zeek/logs/current/*-json.log"
    codec => "json"
    tags => ["zeek", "json"]
    type => "zeek-json"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb_zeek_json"
    sincedb_clean_after => 0
  }
}
filter {
  # First, ensure all documents have a classification field
  mutate {
    add_field => {
      "classification" => "unknown"  # Default classification
    }
  }
  # Extract log type from path
  if [path] {
    grok {
      match => { "path" => "%{GREEDYDATA}/%{GREEDYDATA:log_type}\.log" }
    }
  }
  # Add common fields
  mutate {
    add_field => {
      "alert_source" => "zeek"
      "processed_by" => ["zeek_logstash"]
    }
  }
  # Process notice logs specifically - this is where attack detections are logged
  if [log_type] == "notice" {
    # Parse TSV format for regular notice.log
    if [type] == "zeek" {
      csv {
        separator => "\t"
        columns => ["ts", "uid", "id.orig_h", "id.orig_p", "id.resp_h", "id.resp_p", "fuid", "file_mime_type", "file_desc", "proto", "note", "msg", "sub", "src", "dst", "p", "n", "peer_descr", "actions", "suppress_for", "dropped", "remote_location.country_code", "remote_location.region", "remote_location.city", "remote_location.latitude", "remote_location.longitude"]
      }
    }
    # Map fields to standardized names
    mutate {
      add_field => {
        "src_ip" => "%{[id.orig_h]}"
        "dest_ip" => "%{[id.resp_h]}"
        "src_port" => "%{[id.orig_p]}"
        "dest_port" => "%{[id.resp_p]}"
        "message" => "%{[note]}: %{[msg]}"
      }
    }
    # CRITICAL FIX: Store original note value before any modifications
    if [note] {
      mutate {
        add_field => { "original_note" => "%{note}" }
      }
    }
    # Process SQL Injection notices - PRESERVE ORIGINAL FORMAT
    if [note] =~ /(?i)SQL_Injection/ or [msg] =~ /(?i)SQL injection/ {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Attack"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Process HTTP::SQL_Injection_Victim notices
    else if [note] == "HTTP::SQL_Injection_Victim" {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Victim"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Process HTTP::SQL_Injection_Attacker notices
    else if [note] == "HTTP::SQL_Injection_Attacker" {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Attacker"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Process AttackDetection::SQL_Injection notices
    else if [note] == "AttackDetection::SQL_Injection" {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Attack"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Process SNIFFPASS notices (unchanged)
    else if [note] =~ /(?i)^SNIFFPASS::/ {
      mutate {
        add_field => { 
          "classification" => "policy-violation"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "Password_Seen"
        }
        add_tag => ["attack_detected"]
      }
    }
    # Default for other notices
    else {
      mutate {
        add_field => {
          "classification" => "misc-activity"
          "priority" => "3"
          "severity" => "3"
        }
      }
    }
  }
  # Process HTTP logs - enhanced SQL injection detection in URIs and parameters
  else if [log_type] == "http" {
    # Parse TSV format for regular http.log
    if [type] == "zeek" {
      csv {
        separator => "\t"
        columns => ["ts", "uid", "id.orig_h", "id.orig_p", "id.resp_h", "id.resp_p", "trans_depth", "method", "host", "uri", "referrer", "version", "user_agent", "origin", "request_body_len", "response_body_len", "status_code", "status_msg", "info_code", "info_msg", "tags", "username", "password", "proxied", "orig_fuids", "orig_filenames", "orig_mime_types", "resp_fuids", "resp_filenames", "resp_mime_types"]
      }
    }
    # Map fields to standardized names
    mutate {
      add_field => {
        "src_ip" => "%{[id.orig_h]}"
        "dest_ip" => "%{[id.resp_h]}"
        "src_port" => "%{[id.orig_p]}"
        "dest_port" => "%{[id.resp_p]}"
        "message" => "HTTP %{[method]} %{[host]}%{[uri]}"
      }
    }
    # SQL Injection detection in URI - simplified pattern to avoid Logstash issues
    if [uri] {
      # Basic SQL injection patterns
      if [uri] =~ /(?i)(select .* from)|(union .* select)|(insert .* into)|(update .* set)|(delete .* from)|(drop .* table)|(exec .* sp_)|(xp_cmdshell)|(declare .*)|(select .* sleep)|(benchmark\()|(1=1)|(1 *= *1)|(1' *= *'1)|(1" *= *"1)|(' *or *')|(" *or *")|(admin'--)/ {
        mutate {
          add_field => { 
            "classification" => "web-application-attack"
            "priority" => "1"
            "severity" => "1"
            "signature_id" => "SQL_Injection_URI"
            "note" => "AttackDetection::SQL_Injection"
            "debug_sql_injection" => "true"
          }
          add_tag => ["attack_detected", "sql_injection"]
        }
      }
      # Additional SQL injection patterns
      else if [uri] =~ /(?i)(waitfor *delay)|(load_file\()|(into *outfile)|(into *dumpfile)|(' *and *')|(" *and *")|(' *like *")|(" *like *")|(' *\|\| *')|(" *\|\| *")|(\/\*)|(--[[:space:]])|(\*\/)|(#.*)|(;--)/ {
        mutate {
          add_field => { 
            "classification" => "web-application-attack"
            "priority" => "1"
            "severity" => "1"
            "signature_id" => "SQL_Injection_URI_Advanced"
            "note" => "AttackDetection::SQL_Injection"
            "debug_sql_injection" => "true"
          }
          add_tag => ["attack_detected", "sql_injection"]
        }
      }
    }
    # Extract and analyze query parameters for SQL injection
    if [uri] and [uri] =~ /\?/ {
      # Extract query parameters
      grok {
        match => { "uri" => "%{NOTSPACE:uri_path}\?%{GREEDYDATA:query_string}" }
        tag_on_failure => ["_grokparsefailure", "uri_parse_failure"]
      }
      # Check query parameters for SQL injection - simplified pattern
      if [query_string] and [query_string] =~ /(?i)(select .* from)|(union .* select)|(insert .* into)|(update .* set)|(delete .* from)|(drop .* table)|(exec .* sp_)|(xp_cmdshell)|(declare .*)|(select .* sleep)|(benchmark\()|(1=1)|(1 *= *1)|(1' *= *'1)|(1" *= *"1)|(' *or *')|(" *or *")|(admin'--)/ {
        mutate {
          add_field => { 
            "classification" => "web-application-attack"
            "priority" => "1"
            "severity" => "1"
            "signature_id" => "SQL_Injection_Query_Params"
            "note" => "AttackDetection::SQL_Injection"
            "debug_sql_injection" => "true"
          }
          add_tag => ["attack_detected", "sql_injection"]
        }
      }
    }
    # Check for SQL injection in HTTP headers
    if [referrer] and [referrer] =~ /(?i)(select .* from)|(union .* select)|(insert .* into)|(update .* set)|(delete .* from)|(drop .* table)|(1=1)|(1' *= *'1)/ {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Referrer"
          "note" => "AttackDetection::SQL_Injection"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Check for SQL injection in user agent
    if [user_agent] and [user_agent] =~ /(?i)(select .* from)|(union .* select)|(insert .* into)|(update .* set)|(delete .* from)|(drop .* table)|(1=1)|(1' *= *'1)/ {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_UserAgent"
          "note" => "AttackDetection::SQL_Injection"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Check for SQL injection in HTTP method (rare but possible)
    if [method] and [method] =~ /(?i)(select)|(union)|(insert)|(update)|(delete)|(drop)/ {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Method"
          "note" => "AttackDetection::SQL_Injection"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
    # Check for common SQL injection tools in user agent
    if [user_agent] and [user_agent] =~ /(?i)(sqlmap)|(havij)|(sqlninja)/ {
      mutate {
        add_field => { 
          "classification" => "web-application-attack"
          "priority" => "1"
          "severity" => "1"
          "signature_id" => "SQL_Injection_Tool_Detected"
          "note" => "AttackDetection::SQL_Injection"
          "debug_sql_injection" => "true"
        }
        add_tag => ["attack_detected", "sql_injection"]
      }
    }
  }
  # Process other log types (simplified)
  else {
    # Map common fields if available
    if [id.orig_h] {
      mutate {
        add_field => {
          "src_ip" => "%{[id.orig_h]}"
          "dest_ip" => "%{[id.resp_h]}"
          "src_port" => "%{[id.orig_p]}"
          "dest_port" => "%{[id.resp_p]}"
        }
      }
    }
  }
  # Convert numeric fields
  mutate {
    convert => {
      "src_port" => "integer"
      "dest_port" => "integer"
      "priority" => "integer"
      "severity" => "integer"
    }
  }
  # Ensure timestamp is properly formatted
  date {
    match => [ "ts", "UNIX", "UNIX_MS" ]
    target => "@timestamp"
  }
  # CRITICAL FIX: For SQL injection alerts, restore the original note field if it was modified
  if [original_note] {
    mutate {
      replace => { "note" => "%{original_note}" }
      remove_field => ["original_note"]
    }
  }
  # Add debug information to all events
  mutate {
    add_field => {
      "debug_info" => "Processed by enhanced Logstash config"
    }
  }
}
output {
  # Debug output for SQL injection alerts
  if [debug_sql_injection] == "true" {
    file {
      path => "/var/log/logstash/sql_injection_alerts.log"
      codec => rubydebug
    }
  }
  # Standard Elasticsearch output
  elasticsearch {
    hosts => ["http://54.91.203.196:9200"]
    index => "zeek-alerts-%{+YYYY.MM.dd}"
    document_id => "%{[uid]}-%{+YYYY.MM.dd.HH.mm.ss}"
  }
  # Debug output to console
  stdout { codec => rubydebug }
}
